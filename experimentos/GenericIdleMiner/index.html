<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo Incremental Dopamina</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <script src="./ga-sdk/js/GameAnalytics.min.js"></script>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PVR4R17HFG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PVR4R17HFG');
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div id="toast" class="toast">Mensagem suave!</div>
      <div id="stats">
        <p>Moedas: <span id="coins">0</span></p>
        <p>Objetos por segundo: <span id="drop-rate">1</span></p>
        <p>Tempo de Jogo: <span id="play-time">00:00:00</span></p>
      </div>
      <div id="upgrades" style="height: 500px; overflow: scroll;">
        <h2>Upgrades</h2>
        <button onclick="buyUpgrade('dropRate', 10, 1.5, 0.5)">Aumentar Taxa de Drop (Custo: <span id="dropRateCost">10</span>) <span id="dropRateLevel" class="upgrade-level">0/99</span></button>
        <button onclick="buyUpgrade('multiplier', 50, 2, 2)">Multiplicador de Moedas (Custo: <span id="multiplierCost">50</span>) <span id="multiplierLevel" class="upgrade-level">0/99</span></button>
        <button onclick="buyUpgrade('particleEffect', 100, 1.5, 5)">Melhorar Partículas (Custo: <span id="particleEffectCost">100</span>) <span id="particleEffectLevel" class="upgrade-level">0/99</span></button>
        <button onclick="buyUpgrade('autoCollector', 200, 2, 1)">Adicionar Coletor (Custo: <span id="autoCollectorCost">200</span>) <span id="autoCollectorLevel" class="upgrade-level">0/99</span></button>
        <button onclick="buyUpgrade('triangleChance', 150, 2.2, 2)">Chance de Triângulos (Custo: <span id="triangleChanceCost">150</span>) <span id="triangleChanceLevel" class="upgrade-level">0/99</span></button>
        <button onclick="buyUpgrade('squareChance', 150, 2.2, 2)">Chance de Quadrados (Custo: <span id="squareChanceCost">150</span>) <span id="squareChanceLevel" class="upgrade-level">0/99</span></button>
        <button onclick="buyUpgrade('pentagonChance', 150, 2.2, 2)">Chance de Pentágonos (Custo: <span id="pentagonChanceCost">150</span>) <span id="pentagonChanceLevel" class="upgrade-level">0/99</span></button>
        <button onclick="buyUpgrade('autoClicker', 80, 1.7, 0.5)">Taxa de Auto-Clicker (Custo: <span id="autoClickerCost">80</span>) <span id="autoClickerLevel" class="upgrade-level">0/99</span></button>
        <button onclick="buyUpgrade('clickArea', 120, 1.9, 5)">Aumentar Área de Clique (Custo: <span id="clickAreaCost">120</span>) <span id="clickAreaLevel" class="upgrade-level">0/99</span></button>
        <button onclick="saveGame()">Salvar Jogo</button>
        <button onclick="loadGame()">Carregar Jogo</button>
        <button onclick="clearSaves()">Deletar Save</button>
      </div>
    </div>
    <div id="drop-chances">
      <h2>Chances de Drop</h2>
      <div class="shape-chance">
        <svg width="30" height="30" viewBox="-15 -15 30 30">
          <circle cx="0" cy="0" r="12" fill="#4CAF50" stroke="#FFFFFF" stroke-width="2"/>
        </svg>
        <span>Círculo: <span id="circleChance">0%</span></span>
      </div>
      <div class="shape-chance">
        <svg width="30" height="30" viewBox="-15 -15 30 30">
          <polygon points="0,-12 10.4,6 -10.4,6" fill="#2196F3" stroke="#FFFFFF" stroke-width="2"/>
        </svg>
        <span>Triângulo: <span id="triangleChance">0%</span></span>
      </div>
      <div class="shape-chance">
        <svg width="30" height="30" viewBox="-15 -15 30 30">
          <rect x="-12" y="-12" width="24" height="24" fill="#F44336" stroke="#FFFFFF" stroke-width="2"/>
        </svg>
        <span>Quadrado: <span id="squareChance">0%</span></span>
      </div>
      <div class="shape-chance">
        <svg width="30" height="30" viewBox="-15 -15 30 30">
          <polygon points="0,-12 11.3,-3.7 7,9 -7,9 -11.3,-3.7" fill="#FF9800" stroke="#FFFFFF" stroke-width="2"/>
        </svg>
        <span>Pentágono: <span id="pentagonChance">0%</span></span>
      </div>
    </div>
  </div>
  <div id="version-frame">Versão: v0.0.18</div>
  <script>
    let coins = 0;
    let startTime = Date.now();
    let totalPlayTime = 0;
    let upgrades = {
      dropRate: { value: 1, level: 0 },
      multiplier: { value: 1, level: 0 },
      particleEffect: { value: 10, level: 0 },
      autoCollector: { value: 0, level: 0 },
      triangleChance: { value: 0, level: 0 },
      squareChance: { value: 0, level: 0 },
      pentagonChance: { value: 0, level: 0 },
      autoClicker: { value: 0, level: 0 },
      clickArea: { value: 10, level: 0 }
    };
    let objects = [];
    let particles = [];
    let collectors = [];
    let clickEffects = [];
    let spawnEffects = [];
    let damageEffects = [];

    // Base de dados de objetos
    const shapeTypes = [
      { type: 'circle', sizeRange: [5, 30], healthRange: [1, 5], coinRange: [1, 10], baseChance: 50 },
      { type: 'triangle', sizeRange: [15, 35], healthRange: [10, 20], coinRange: [15, 30], baseChance: 5 },
      { type: 'square', sizeRange: [20, 40], healthRange: [20, 40], coinRange: [40, 80], baseChance: 2 },
      { type: 'pentagon', sizeRange: [25, 45], healthRange: [50, 100], coinRange: [100, 200], baseChance: 1 }
    ];

    function setup() {
      let canvas = createCanvas(windowWidth - 420, windowHeight);
      canvas.parent('game-container');
      background(50);
      let savedState = localStorage.getItem('dopamineGameSave');
      if (savedState) {
        let gameState = JSON.parse(savedState);
        totalPlayTime = gameState.totalPlayTime || 0;
      }
      updateStats();
      loadGame();
      startAutoSave();
      GameAnalytics("setEnabledInfoLog", true);
      GameAnalytics("initialize", "59e28319882515cd0b7a00c0fa7bdbd3", "4753424e89922ada37e553eace0400d4872beb5b");
      GameAnalytics("addDesignEvent", "View:DropChancesPanel");
    }

    function formatTime(ms) {
      let seconds = Math.floor(ms / 1000);
      let hours = Math.floor(seconds / 3600);
      seconds %= 3600;
      let minutes = Math.floor(seconds / 60);
      seconds %= 60;
      return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getDropChance(shapeType) {
      let totalChance = shapeTypes.reduce((sum, shape) => {
        return sum + (shape.type === 'circle' ? shape.baseChance : shape.baseChance + upgrades[shape.type + 'Chance'].value);
      }, 0);
      let shape = shapeTypes.find(s => s.type === shapeType);
      let chance = shape.type === 'circle' ? shape.baseChance : shape.baseChance + upgrades[shape.type + 'Chance'].value;
      return (chance / totalChance * 100).toFixed(2);
    }

    function draw() {
      background(50, 50, 80, 255);
      totalPlayTime += deltaTime;
      document.getElementById('play-time').innerText = formatTime(totalPlayTime);

      // Adicionar novos objetos com base na taxa de drop
      if (frameCount % max(1, floor(60 / upgrades.dropRate.value)) === 0) {
        let objData = getRandomObject();
        let obj = {
          x: random(width),
          y: random(height),
          size: objData.size,
          coinValue: objData.coinValue,
          health: objData.health,
          maxHealth: objData.health,
          color: color(random(100, 255), random(100, 255), random(100, 255)),
          collected: false,
          spawnScale: 0,
          showHealthBar: false,
          healthBarTimer: 0,
          shapeType: objData.shapeType
        };
        objects.push(obj);
        spawnEffects.push({ x: obj.x, y: obj.y, life: 20, size: obj.size });
      }

      // Atualizar e desenhar efeitos de spawn
      for (let i = spawnEffects.length - 1; i >= 0; i--) {
        let effect = spawnEffects[i];
        effect.life -= 1;
        let scale = map(effect.life, 0, 20, 1, 0);
        noFill();
        stroke(255, 255, 255, map(effect.life, 0, 20, 0, 150));
        strokeWeight(2);
        ellipse(effect.x, effect.y, effect.size * scale);
        if (effect.life <= 0) spawnEffects.splice(i, 1);
      }

      // Atualizar e desenhar objetos
      for (let i = objects.length - 1; i >= 0; i--) {
        let obj = objects[i];
        if (!obj.collected) {
          obj.spawnScale = min(obj.spawnScale + 0.1, 1);
          let healthRatio = obj.health / obj.maxHealth;
          fill(obj.color.levels[0], obj.color.levels[1] * healthRatio, obj.color.levels[2] * healthRatio);
          noStroke();
          drawShape(obj);
          if (obj.showHealthBar && obj.healthBarTimer > 0) {
            obj.healthBarTimer -= 1;
            fill(255, 0, 0);
            rect(obj.x - obj.size / 2, obj.y - obj.size / 2 - 10, obj.size * healthRatio, 5);
            if (obj.healthBarTimer <= 0) obj.showHealthBar = false;
          }
        }
      }

      // Atualizar e desenhar coletores
      for (let collector of collectors) {
        collector.x += collector.vx;
        collector.y += collector.vy;
        if (random() < 0.05) {
          collector.vx = random(-2, 2);
          collector.vy = random(-2, 2);
        }
        collector.x = constrain(collector.x, 0, width);
        collector.y = constrain(collector.y, 0, height);
        fill(255, 215, 0);
        rect(collector.x - 15, collector.y - 15, 30, 30);
        for (let i = objects.length - 1; i >= 0; i--) {
          let obj = objects[i];
          if (!obj.collected && dist(collector.x, collector.y, obj.x, obj.y) < obj.size + 15) {
            let damage = 1 + upgrades.clickArea.value / 10;
            obj.health -= damage;
            obj.showHealthBar = true;
            obj.healthBarTimer = 120;
            damageEffects.push({
              x: obj.x,
              y: obj.y - 10,
              text: `-${damage.toFixed(1)}`,
              life: 30,
              vy: -1
            });
            if (obj.health <= 0) {
              obj.collected = true;
              coins += obj.coinValue * upgrades.multiplier.value;
              updateStats();
              createParticleExplosion(obj.x, obj.y, obj.color);
              objects.splice(i, 1);
              GameAnalytics("addProgressionEvent", "Complete", `Destroy:${obj.shapeType}`);
            }
          }
        }
      }

      // Auto-clicker
      if (upgrades.autoClicker.value > 0 && frameCount % max(1, floor(60 / upgrades.autoClicker.value)) === 0) {
        let target = objects.find(obj => !obj.collected);
        if (target) {
          simulateClick(target.x, target.y);
        }
      }

      // Atualizar e desenhar partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life -= 1;
        fill(p.color.levels[0], p.color.levels[1], p.color.levels[2], p.life);
        ellipse(p.x, p.y, p.size);
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Atualizar e desenhar efeitos de clique
      for (let i = clickEffects.length - 1; i >= 0; i--) {
        let effect = clickEffects[i];
        effect.life -= 1;
        let alpha = map(effect.life, 0, 30, 0, 100);
        noFill();
        stroke(255, 255, 0, alpha);
        strokeWeight(2);
        rectMode(CENTER);
        rect(effect.x, effect.y, effect.size * (30 - effect.life) / 30, effect.size * (30 - effect.life) / 30);
        rectMode(CORNER);
        if (effect.life <= 0) clickEffects.splice(i, 1);
      }

      // Atualizar e desenhar efeitos de dano
      for (let i = damageEffects.length - 1; i >= 0; i--) {
        let effect = damageEffects[i];
        effect.y += effect.vy;
        effect.life -= 1;
        fill(255, 255, 255, map(effect.life, 0, 30, 0, 255));
        textSize(12);
        textAlign(CENTER);
        text(effect.text, effect.x, effect.y);
        if (effect.life <= 0) damageEffects.splice(i, 1);
      }

      // Limitar número de partículas para desempenho
      if (particles.length > 200) particles.splice(0, particles.length - 200);
      if (damageEffects.length > 50) damageEffects.splice(0, damageEffects.length - 50);
    }

    function drawShape(obj) {
      push();
      translate(obj.x, obj.y);
      scale(obj.spawnScale);
      if (obj.shapeType === 'circle') {
        ellipse(0, 0, obj.size);
      } else if (obj.shapeType === 'triangle') {
        triangle(
          0, -obj.size / 2,
          obj.size / 2, obj.size / 2,
          -obj.size / 2, obj.size / 2
        );
      } else if (obj.shapeType === 'square') {
        rectMode(CENTER);
        rect(0, 0, obj.size, obj.size);
        rectMode(CORNER);
      } else if (obj.shapeType === 'pentagon') {
        beginShape();
        for (let i = 0; i < 5; i++) {
          let angle = TWO_PI / 5 * i;
          vertex(obj.size / 2 * cos(angle), obj.size / 2 * sin(angle));
        }
        endShape(CLOSE);
      }
      pop();
    }

    function getRandomObject() {
      let totalChance = shapeTypes.reduce((sum, shape) => {
        return sum + (shape.type === 'circle' ? shape.baseChance : shape.baseChance + upgrades[shape.type + 'Chance'].value);
      }, 0);
      let rand = random(totalChance);
      let cumulative = 0;
      let selectedShape = shapeTypes[0];
      for (let shape of shapeTypes) {
        let shapeChance = shape.type === 'circle' ? shape.baseChance : shape.baseChance + upgrades[shape.type + 'Chance'].value;
        cumulative += shapeChance;
        if (rand < cumulative) {
          selectedShape = shape;
          break;
        }
      }
      let size = random(selectedShape.sizeRange[0], selectedShape.sizeRange[1]);
      let health = random(selectedShape.healthRange[0], selectedShape.healthRange[1]);
      let coinValue = random(selectedShape.coinRange[0], selectedShape.coinRange[1]);
      return { size, health, coinValue, shapeType: selectedShape.type };
    }

    function calculateCoinValue(size) {
      if (size <= 10) return 1;
      if (size <= 20) return 3;
      return 10;
    }

    function calculateHealth(size) {
      if (size <= 10) return 10;
      if (size <= 20) return 20;
      return 30;
    }

    function simulateClick(x, y) {
      let hit = false;
      let damage = 1 + upgrades.clickArea.value / 10;
      for (let i = objects.length - 1; i >= 0; i--) {
        let obj = objects[i];
        if (!obj.collected && dist(x, y, obj.x, obj.y) < obj.size + upgrades.clickArea.value) {
          obj.health -= damage;
          obj.showHealthBar = true;
          obj.healthBarTimer = 120;
          damageEffects.push({
            x: obj.x,
            y: obj.y - 10,
            text: `-${damage.toFixed(1)}`,
            life: 30,
            vy: -1
          });
          if (obj.health <= 0) {
            obj.collected = true;
            coins += obj.coinValue * upgrades.multiplier.value;
            updateStats();
            createParticleExplosion(obj.x, obj.y, obj.color);
            GameAnalytics("addProgressionEvent", "Complete", `Destroy:${obj.shapeType}`);
          }
          hit = true;
        }
      }
      clickEffects.push({ x: x, y: y, size: upgrades.clickArea.value * 2, life: 30 });
      return hit;
    }

    function mousePressed() {
      simulateClick(mouseX, mouseY);
    }

    function createParticleExplosion(x, y, baseColor) {
      let particleCount = upgrades.particleEffect.value;
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: x,
          y: y,
          vx: random(-3, 3),
          vy: random(-3, 3),
          size: random(3, 8),
          color: color(
            constrain(baseColor.levels[0] + random(-50, 50), 0, 255),
            constrain(baseColor.levels[1] + random(-50, 50), 0, 255),
            constrain(baseColor.levels[2] + random(-50, 50), 0, 255)
          ),
          life: random(20, 60)
        });
      }
    }

    function buyUpgrade(type, baseCost, costMultiplier, increment) {
      let level = upgrades[type].level;
      if (level >= 99) {
        showToast('Upgrade atingiu o nível máximo (99)!');
        return;
      }
      let cost = Math.round(baseCost * (1 + level * costMultiplier));
      if (coins >= cost) {
        coins -= cost;
        upgrades[type].level += 1;
        if (type === 'dropRate') upgrades.dropRate.value += increment;
        else if (type === 'multiplier') upgrades.multiplier.value += increment;
        else if (type === 'particleEffect') upgrades.particleEffect.value += increment;
        else if (type === 'autoCollector') {
          collectors.push({ x: width / 2, y: height / 2, vx: random(-2, 2), vy: random(-2, 2) });
          upgrades.autoCollector.value += increment;
        }
        else if (type === 'triangleChance' || type === 'squareChance' || type === 'pentagonChance') {
          upgrades[type].value += increment;
          showToast(`Chance de ${type.replace('Chance', '')} aumentada!`);
        }
        else if (type === 'autoClicker') upgrades.autoClicker.value += increment;
        else if (type === 'clickArea') upgrades.clickArea.value += increment;
        updateStats();
        createUpgradeParticles();
        let nextCost = Math.round(baseCost * (1 + (level + 1) * costMultiplier));
        document.getElementById(type + 'Cost').innerText = formatLargeNumber(nextCost);
        document.getElementById(type + 'Level').innerText = `${upgrades[type].level}/99`;
        GameAnalytics("addResourceEvent", "Sink", "Coins", type, "Upgrade", cost);
      } else {
        showToast('Moedas insuficientes para comprar este upgrade! Custo: ' + formatLargeNumber(cost));
      }
    }

    function createUpgradeParticles() {
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: random(width),
          y: random(height),
          vx: random(-5, 5),
          vy: random(-5, 5),
          size: random(5, 10),
          color: color(random(150, 255), random(100, 255), 0),
          life: random(30, 80)
        });
      }
    }

    function updateStats() {
      document.getElementById('coins').innerText = formatLargeNumber(coins);
      document.getElementById('drop-rate').innerText = upgrades.dropRate.value.toFixed(1);
      ['dropRate', 'multiplier', 'particleEffect', 'autoCollector', 'triangleChance', 'squareChance', 'pentagonChance', 'autoClicker', 'clickArea'].forEach(type => {
        let baseCost = { dropRate: 10, multiplier: 50, particleEffect: 100, autoCollector: 200, triangleChance: 150, squareChance: 150, pentagonChance: 150, autoClicker: 80, clickArea: 120 }[type];
        let costMultiplier = { dropRate: 1.5, multiplier: 2, particleEffect: 1.5, autoCollector: 2, triangleChance: 2.2, squareChance: 2.2, pentagonChance: 2.2, autoClicker: 1.7, clickArea: 1.9 }[type];
        let cost = Math.round(baseCost * (1 + upgrades[type].level * costMultiplier));
        document.getElementById(type + 'Cost').innerText = formatLargeNumber(cost);
        document.getElementById(type + 'Level').innerText = `${upgrades[type].level}/99`;
      });
      // Atualizar chances de drop
      shapeTypes.forEach(shape => {
        document.getElementById(`${shape.type}Chance`).innerText = `${getDropChance(shape.type)}%`;
      });
    }

    function startAutoSave() {
      setInterval(() => {
        saveGame();
        showToast('Jogo salvo automaticamente!');
      }, 30000);
    }

    function saveGame() {
      let gameState = {
        coins: coins,
        upgrades: upgrades,
        collectors: collectors.map(c => ({ x: c.x, y: c.y, vx: c.vx, vy: c.vy })),
        totalPlayTime: totalPlayTime,
        objects: objects.map(o => ({
          x: o.x,
          y: o.y,
          size: o.size,
          coinValue: o.coinValue,
          health: o.health,
          maxHealth: o.maxHealth,
          color: o.color.levels,
          collected: o.collected,
          spawnScale: o.spawnScale,
          showHealthBar: o.showHealthBar,
          healthBarTimer: o.healthBarTimer,
          shapeType: o.shapeType
        }))
      };
      localStorage.setItem('dopamineGameSave', JSON.stringify(gameState));
      showToast('Jogo salvo com sucesso!');
    }

    function loadGame() {
      let savedState = localStorage.getItem('dopamineGameSave');
      if (savedState) {
        let gameState = JSON.parse(savedState);
        coins = gameState.coins || 0;
        upgrades = gameState.upgrades || {
          dropRate: { value: 1, level: 0 },
          multiplier: { value: 1, level: 0 },
          particleEffect: { value: 10, level: 0 },
          autoCollector: { value: 0, level: 0 },
          triangleChance: { value: 0, level: 0 },
          squareChance: { value: 0, level: 0 },
          pentagonChance: { value: 0, level: 0 },
          autoClicker: { value: 0, level: 0 },
          clickArea: { value: 10, level: 0 }
        };
        if (gameState.upgrades && gameState.upgrades.largeObjectChance) {
          upgrades.triangleChance = { value: gameState.upgrades.largeObjectChance.value / 3, level: Math.floor(gameState.upgrades.largeObjectChance.level / 3) };
          upgrades.squareChance = { value: gameState.upgrades.largeObjectChance.value / 3, level: Math.floor(gameState.upgrades.largeObjectChance.level / 3) };
          upgrades.pentagonChance = { value: gameState.upgrades.largeObjectChance.value / 3, level: Math.floor(gameState.upgrades.largeObjectChance.level / 3) };
        }
        collectors = gameState.collectors ? gameState.collectors.map(c => ({
          x: c.x,
          y: c.y,
          vx: c.vx,
          vy: c.vy
        })) : [];
        objects = gameState.objects ? gameState.objects.map(o => ({
          x: o.x,
          y: o.y,
          size: o.size,
          coinValue: o.coinValue,
          health: o.health || calculateHealth(o.size),
          maxHealth: o.maxHealth || calculateHealth(o.size),
          color: color(o.color[0], o.color[1], o.color[2]),
          collected: o.collected,
          spawnScale: o.spawnScale,
          showHealthBar: o.showHealthBar || false,
          healthBarTimer: o.healthBarTimer || 0,
          shapeType: o.shapeType || 'circle'
        })) : [];
        totalPlayTime = gameState.totalPlayTime || 0;
        updateStats();
        showToast(`Jogo carregado com sucesso! Tempo total: ${formatTime(totalPlayTime)}`);
      } else {
        showToast('Nenhum jogo salvo encontrado.');
      }
    }

    function clearSaves() {
      localStorage.removeItem('dopamineGameSave');
      coins = 0;
      upgrades = {
        dropRate: { value: 1, level: 0 },
        multiplier: { value: 1, level: 0 },
        particleEffect: { value: 10, level: 0 },
        autoCollector: { value: 0, level: 0 },
        triangleChance: { value: 0, level: 0 },
        squareChance: { value: 0, level: 0 },
        pentagonChance: { value: 0, level: 0 },
        autoClicker: { value: 0, level: 0 },
        clickArea: { value: 10, level: 0 }
      };
      collectors = [];
      objects = [];
      particles = [];
      clickEffects = [];
      spawnEffects = [];
      damageEffects = [];
      totalPlayTime = 0;
      updateStats();
      showToast('Todos os saves foram limpos!');
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function formatLargeNumber(number, locale = navigator.language) {
      try {
        if (isNaN(number) || number === null) return "0";
        const suffixes = [
          { threshold: 1e12, suffix: "T" },
          { threshold: 1e9, suffix: "B" },
          { threshold: 1e6, suffix: "M" },
          { threshold: 1e3, suffix: "K" },
          { threshold: 1, suffix: "" }
        ];
        const tier = suffixes.find(t => Math.abs(number) >= t.threshold) || suffixes[suffixes.length - 1];
        const scaled = number / tier.threshold;
        const formatter = new Intl.NumberFormat(locale, {
          maximumFractionDigits: scaled >= 10 ? 0 : 1,
          minimumFractionDigits: 0
        });
        return `${formatter.format(scaled)}${tier.suffix}`;
      } catch (error) {
        console.error("Erro ao formatar número:", error);
        return number.toString();
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth - 420, windowHeight);
    }
  </script>
