<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogo Incremental Dopamina</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; color: #fff; font-family: Arial, sans-serif; }
    #game-container { display: flex; }
    #ui { width: 200px; padding: 10px; background: #333; }
    button { 
      width: 100%; 
      margin: 5px 0; 
      padding: 10px; 
      background: #6200ea; 
      color: #fff; 
      border: none; 
      border-radius: 5px; 
      cursor: pointer; 
      transition: transform 0.2s, background 0.2s;
    }
    button:hover { background: #7c4dff; transform: scale(1.05); }
    button:active { transform: scale(0.95); }
    #stats { margin-bottom: 20px; }
    #version-frame {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      color: #fff;
      font-size: 14px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="ui">
      <div id="stats">
        <p>Moedas: <span id="coins">0</span></p>
        <p>Objetos por segundo: <span id="drop-rate">1</span></p>
      </div>
      <button onclick="buyUpgrade('dropRate', 10, 1.5, 0.5)">Aumentar Taxa de Drop (Custo: <span id="dropRateCost">10</span>)</button>
      <button onclick="buyUpgrade('multiplier', 50, 2, 2)">Multiplicador de Moedas (Custo: <span id="multiplierCost">50</span>)</button>
      <button onclick="buyUpgrade('particleEffect', 100, 1.5, 5)">Melhorar Partículas (Custo: <span id="particleEffectCost">100</span>)</button>
      <button onclick="buyUpgrade('autoCollector', 200, 2, 1)">Adicionar Coletor (Custo: <span id="autoCollectorCost">200</span>)</button>
      <button onclick="buyUpgrade('smallBallChance', 30, 1.8, 5)">Chance de Bolas Menores (Custo: <span id="smallBallChanceCost">30</span>)</button>
      <button onclick="buyUpgrade('largeBallChance', 150, 2.2, 2)">Chance de Bolas Maiores (Custo: <span id="largeBallChanceCost">150</span>)</button>
      <button onclick="buyUpgrade('autoClicker', 80, 1.7, 0.5)">Taxa de Auto-Clicker (Custo: <span id="autoClickerCost">80</span>)</button>
      <button onclick="buyUpgrade('clickArea', 120, 1.9, 5)">Aumentar Área de Clique (Custo: <span id="clickAreaCost">120</spanHe>)</button>
      <button onclick="saveGame()">Salvar Jogo</button>
      <button onclick="loadGame()">Carregar Jogo</button>
    </div>
    <div id="version-frame">Versão: v0.0.5</div>
  </div>
  <script>
    let coins = 0;
    let upgrades = {
      dropRate: { value: 1, level: 0 },
      multiplier: { value: 1, level: 0 },
      particleEffect: { value: 10, level: 0 },
      autoCollector: { value: 0, level: 0 },
      smallBallChance: { value: 50, level: 0 },
      largeBallChance: { value: 10, level: 0 },
      autoClicker: { value: 0, level: 0 },
      clickArea: { value: 10, level: 0 }
    };
    let objects = [];
    let particles = [];
    let collectors = [];
    let clickEffects = [];

    function setup() {
      let canvas = createCanvas(windowWidth - 220, windowHeight);
      canvas.parent('game-container');
      background(50);
      updateStats();
    }

    function draw() {
      background(50, 50, 80, 255);
      // Adicionar novos objetos com base na taxa de drop
      if (frameCount % max(1, floor(60 / upgrades.dropRate.value)) === 0) {
        let size = getRandomBallSize();
        let coinValue = calculateCoinValue(size);
        objects.push({
          x: random(width),
          y: random(height),
          size: size,
          coinValue: coinValue,
          color: color(random(100, 255), random(100, 255), random(100, 255)),
          collected: false
        });
      }

      // Atualizar e desenhar objetos
      for (let i = objects.length - 1; i >= 0; i--) {
        let obj = objects[i];
        if (!obj.collected) {
          fill(obj.color);
          noStroke();
          ellipse(obj.x, obj.y, obj.size);
        }
      }

      // Atualizar e desenhar coletores
      for (let collector of collectors) {
        collector.x += collector.vx;
        collector.y += collector.vy;
        if (random() < 0.05) { // Mudar direção aleatoriamente
          collector.vx = random(-2, 2);
          collector.vy = random(-2, 2);
        }
        collector.x = constrain(collector.x, 0, width);
        collector.y = constrain(collector.y, 0, height);
        fill(255, 215, 0);
        rect(collector.x - 15, collector.y - 15, 30, 30);
        for (let i = objects.length - 1; i >= 0; i--) {
          let obj = objects[i];
          if (!obj.collected && dist(collector.x, collector.y, obj.x, obj.y) < obj.size + 15) {
            obj.collected = true;
            coins += obj.coinValue * upgrades.multiplier.value;
            updateStats();
            createParticleExplosion(obj.x, obj.y, obj.color);
            objects.splice(i, 1);
          }
        }
      }

      // Auto-clicker
      if (upgrades.autoClicker.value > 0 && frameCount % max(1, floor(60 / upgrades.autoClicker.value)) === 0) {
        let target = objects.find(obj => !obj.collected);
        if (target) {
          simulateClick(target.x, target.y);
        }
      }

      // Atualizar e desenhar partículas
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1; // Gravidade
        p.life -= 1;
        fill(p.color.levels[0], p.color.levels[1], p.color.levels[2], p.life);
        ellipse(p.x, p.y, p.size);
        if (p.life <= 0) particles.splice(i, 1);
      }

      // Atualizar e desenhar efeitos de clique
      for (let i = clickEffects.length - 1; i >= 0; i--) {
        let effect = clickEffects[i];
        effect.life -= 1;
        let alpha = map(effect.life, 0, 30, 0, 100);
        noFill();
        stroke(255, 255, 0, alpha);
        strokeWeight(2);
        ellipse(effect.x, effect.y, effect.size * (30 - effect.life) / 30);
        if (effect.life <= 0) clickEffects.splice(i, 1);
      }

      // Limitar número de partículas para desempenho
      if (particles.length > 200) particles.splice(0, particles.length - 200);
    }

    function getRandomBallSize() {
      let rand = random(100);
      let smallThreshold = upgrades.smallBallChance.value;
      let largeThreshold = upgrades.largeBallChance.value;
      let mediumThreshold = 100 - smallThreshold - largeThreshold;
      if (mediumThreshold < 0) {
        smallThreshold = 50;
        largeThreshold = 10;
        mediumThreshold = 40;
      }
      if (rand < largeThreshold) return random(20, 30); // Bolas grandes
      if (rand < largeThreshold + smallThreshold) return random(5, 10); // Bolas pequenas
      return random(10, 20); // Bolas médias
    }

    function calculateCoinValue(size) {
      if (size <= 10) return 1; // Bolas pequenas
      if (size <= 20) return 3; // Bolas médias
      return 10; // Bolas grandes
    }

    function simulateClick(x, y) {
      for (let i = objects.length - 1; i >= 0; i--) {
        let obj = objects[i];
        if (!obj.collected && dist(x, y, obj.x, obj.y) < obj.size + upgrades.clickArea.value) {
          obj.collected = true;
          coins += obj.coinValue * upgrades.multiplier.value;
          updateStats();
          createParticleExplosion(obj.x, obj.y, obj.color);
          clickEffects.push({ x: x, y: y, size: upgrades.clickArea.value * 2, life: 30 });
          objects.splice(i, 1);
        }
      }
    }

    function mousePressed() {
      simulateClick(mouseX, mouseY);
    }

    function createParticleExplosion(x, y, baseColor) {
      let particleCount = upgrades.particleEffect.value;
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: x,
          y: y,
          vx: random(-3, 3),
          vy: random(-3, 3),
          size: random(3, 8),
          color: color(
            constrain(baseColor.levels[0] + random(-50, 50), 0, 255),
            constrain(baseColor.levels[1] + random(-50, 50), 0, 255),
            constrain(baseColor.levels[2] + random(-50, 50), 0, 255)
          ),
          life: random(20, 60)
        });
      }
    }

    function buyUpgrade(type, baseCost, costMultiplier, increment) {
      let level = upgrades[type].level;
      let cost = Math.round(baseCost * (1 + level * costMultiplier));
      if (coins >= cost) {
        coins -= cost;
        upgrades[type].level += 1;
        if (type === 'dropRate') upgrades.dropRate.value += increment;
        else if (type === 'multiplier') upgrades.multiplier.value += increment;
        else if (type === 'particleEffect') upgrades.particleEffect.value += increment;
        else if (type === 'autoCollector') {
          collectors.push({ x: width / 2, y: height / 2, vx: random(-2, 2), vy: random(-2, 2) });
          upgrades.autoCollector.value += increment;
        }
        else if (type === 'smallBallChance') upgrades.smallBallChance.value += increment;
        else if (type === 'largeBallChance') upgrades.largeBallChance.value += increment;
        else if (type === 'autoClicker') upgrades.autoClicker.value += increment;
        else if (type === 'clickArea') upgrades.clickArea.value += increment;
        updateStats();
        createUpgradeParticles();
        let nextCost = Math.round(baseCost * (1 + (level + 1) * costMultiplier));
        document.getElementById(type + 'Cost').innerText = nextCost;
      }else{
        alert('Moedas insuficientes para comprar este upgrade! custo: ' + cost);
      }
    }

    function createUpgradeParticles() {
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: random(width),
          y: random(height),
          vx: random(-5, 5),
          vy: random(-5, 5),
          size: random(5, 10),
          color: color(random(150, 255), random(100, 255), 0),
          life: random(30, 80)
        });
      }
    }

    function updateStats() {
      document.getElementById('coins').innerText = coins;
      document.getElementById('drop-rate').innerText = upgrades.dropRate.value.toFixed(1);
      // Atualizar custos iniciais
      ['dropRate', 'multiplier', 'particleEffect', 'autoCollector', 'smallBallChance', 'largeBallChance', 'autoClicker', 'clickArea'].forEach(type => {
        let baseCost = { dropRate: 10, multiplier: 50, particleEffect: 100, autoCollector: 200, smallBallChance: 30, largeBallChance: 150, autoClicker: 80, clickArea: 120 }[type];
        let costMultiplier = { dropRate: 1.5, multiplier: 2, particleEffect: 1.5, autoCollector: 2, smallBallChance: 1.8, largeBallChance: 2.2, autoClicker: 1.7, clickArea: 1.9 }[type];
        let cost = Math.round(baseCost * (1 + upgrades[type].level * costMultiplier));
        document.getElementById(type + 'Cost').innerText = cost;
      });
    }

    function saveGame() {
      let gameState = {
        coins: coins,
        upgrades: upgrades,
        collectors: collectors.map(c => ({ x: c.x, y: c.y, vx: c.vx, vy: c.vy }))
      };
      localStorage.setItem('dopamineGameSave', JSON.stringify(gameState));
      alert('Jogo salvo com sucesso!');
    }

    function loadGame() {
      let savedState = localStorage.getItem('dopamineGameSave');
      if (savedState) {
        let gameState = JSON.parse(savedState);
        coins = gameState.coins || 0;
        upgrades = gameState.upgrades || {
          dropRate: { value: 1, level: 0 },
          multiplier: { value: 1, level: 0 },
          particleEffect: { value: 10, level: 0 },
          autoCollector: { value: 0, level: 0 },
          smallBallChance: { value: 50, level: 0 },
          largeBallChance: { value: 10, level: 0 },
          autoClicker: { value: 0, level: 0 },
          clickArea: { value: 10, level: 0 }
        };
        collectors = gameState.collectors ? gameState.collectors.map(c => ({
          x: c.x,
          y: c.y,
          vx: c.vx,
          vy: c.vy
        })) : [];
        updateStats();
        alert('Jogo carregado com sucesso!');
      } else {
        alert('Nenhum jogo salvo encontrado.');
      }
    }

    function windowResized() {
      resizeCanvas(windowWidth - 220, windowHeight);
    }
  </script>
</body>
</html>
